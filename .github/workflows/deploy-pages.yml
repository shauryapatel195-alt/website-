# Publishes the site to GitHub Pages on every push.
#
# `configure-pages` with `enablement: true` switches Pages on for the
# repository automatically, so there is nothing to click in Settings.
# The site is plain static files, so there is no build step — the repo
# root is uploaded as-is (.nojekyll keeps Pages from running Jekyll).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/stanflex-3d-website-6cduwy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
